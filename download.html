  Smart download link for the "Saviour" app.

  WHAT IT DOES
   • Android visitors are redirected straight to the Google Play listing.
   • iOS visitors are redirected to the App Store listing — but ONLY once

     visitors just see the landing page instead of a dead link).
   • Everyone else (desktop, etc.) sees a small landing page with the buttons.

  This is the single source of truth for the store links shared from the app.
  The app's share caption points here (QuoteShare.shareLink in
  lib/core/services/quote_share.dart), so one URL stays correct on every device.

  TO PUBLISH: host this file on GitHub Pages in the SwarjunTech repo (same place
  as saviour-privacy-policy.html). Keep the published path in sync with
  QuoteShare.shareLink — currently:

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Saviour</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1c1e26;
      --muted: #5b6070;
      --accent: #4f46e5;
      --accent-deep: #312e81;
      --border: #e3e6ef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14151a;
        --card: #1d1f27;
        --text: #e9ebf2;
        --muted: #a2a7b8;
        --accent: #8b83ff;
        --accent-deep: #4f46e5;
        --border: #2b2e38;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: min(92vw, 460px);
      margin: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px clamp(22px, 6vw, 40px);
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 34px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    }
    h1 { font-size: clamp(1.5rem, 5vw, 1.9rem); margin: 0 0 6px; }
    .tagline { color: var(--muted); margin: 0 0 26px; }
    .badges { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .badge {
      display: inline-block;
      line-height: 0;
      border-radius: 12px;
      transition: transform .12s ease, opacity .12s ease;
    }
    .badge img { width: auto; display: block; max-width: 100%; }
    /* Google's official PNG carries built-in clear-space padding, so it needs a
       taller box than Apple's tight SVG to look the same visual size. */
    .badge .img-play { height: 66px; }
    .badge .img-ios  { height: 46px; }
    a.badge:hover { transform: translateY(-1px); opacity: .92; }
    a.badge:active { transform: translateY(0); }
    .badge.soon { opacity: .55; cursor: default; }
    .coming { margin: 2px 0 0; font-size: 0.8rem; color: var(--muted); }
    .note { margin-top: 22px; font-size: 0.85rem; color: var(--muted); }
    .redirecting { font-size: 0.9rem; color: var(--muted); margin-top: 18px; }
  </style>
</head>

  <script>
    (function () {
      // --- Store links (single source of truth) -------------------------
      var ANDROID_URL =
        'https://play.google.com/store/apps/details?id=com.swarjun.saviour';
      var IOS_URL = ''; // TODO: set to the App Store URL once Saviour is live on iOS.

      // --- Device sniff --------------------------------------------------
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isAndroid = /android/i.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

      // Upgrade the iOS badge to a real App Store link once we have one,
      // reusing the badge artwork that's already in the page.
      if (IOS_URL) {
        var iosBtn = document.getElementById('iosBtn');
        var iosLink = document.createElement('a');
        iosLink.className = 'badge';
        iosLink.href = IOS_URL;
        iosLink.setAttribute('aria-label', 'Download Saviour on the App Store');
        iosLink.innerHTML = iosBtn.innerHTML;
        iosBtn.parentNode.replaceChild(iosLink, iosBtn);
        var soon = document.getElementById('iosSoon');
        if (soon) soon.hidden = true;
      }

      // Redirect mobile visitors straight to their store.
      var target = isAndroid ? ANDROID_URL : (isIOS && IOS_URL ? IOS_URL : '');
      if (target) {
        document.getElementById('redirecting').hidden = false;
        window.location.replace(target);
      }
    })();
  </script>
