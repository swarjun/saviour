<!doctype html>
<!--
  Smart download link for the "Saviour" app.

  WHAT IT DOES
   • Android visitors are redirected straight to the Google Play listing.
   • iOS visitors are redirected to the App Store listing — but ONLY once
     IOS_URL below is filled in (leave it '' until the iOS app is live, and iOS
     visitors just see the landing page instead of a dead link).
   • Everyone else (desktop, etc.) sees a small landing page with the buttons.

  This is the single source of truth for the store links shared from the app.
  The app's share caption points here (QuoteShare.shareLink in
  lib/core/services/quote_share.dart), so one URL stays correct on every device.

  TO PUBLISH: host this file on GitHub Pages in the SwarjunTech repo (same place
  as saviour-privacy-policy.html). Keep the published path in sync with
  QuoteShare.shareLink — currently:
    https://chitramstudio.github.io/SwarjunTech/saviour-download.html

  WHEN iOS GOES LIVE: set IOS_URL below (and optionally QuoteShare.appStoreUrl).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Saviour</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1c1e26;
      --muted: #5b6070;
      --accent: #4f46e5;
      --accent-deep: #312e81;
      --border: #e3e6ef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14151a;
        --card: #1d1f27;
        --text: #e9ebf2;
        --muted: #a2a7b8;
        --accent: #8b83ff;
        --accent-deep: #4f46e5;
        --border: #2b2e38;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: min(92vw, 460px);
      margin: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px clamp(22px, 6vw, 40px);
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 34px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    }
    h1 { font-size: clamp(1.5rem, 5vw, 1.9rem); margin: 0 0 6px; }
    .tagline { color: var(--muted); margin: 0 0 26px; }
    .badges { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .badge {
      display: inline-block;
      line-height: 0;
      border-radius: 12px;
      transition: transform .12s ease, opacity .12s ease;
    }
    .badge svg { height: 56px; width: auto; display: block; }
    a.badge:hover { transform: translateY(-1px); opacity: .92; }
    a.badge:active { transform: translateY(0); }
    .badge.soon { opacity: .55; cursor: default; }
    .coming { margin: 2px 0 0; font-size: 0.8rem; color: var(--muted); }
    .note { margin-top: 22px; font-size: 0.85rem; color: var(--muted); }
    .redirecting { font-size: 0.9rem; color: var(--muted); margin-top: 18px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">S</div>
    <h1>Saviour</h1>
    <p class="tagline">Every second counts. Answer the call.</p>

    <div class="badges">
      <!-- Official-style "Get it on Google Play" badge (self-contained SVG). -->
      <a class="badge" id="playBtn"
         href="https://play.google.com/store/apps/details?id=com.swarjun.saviour"
         aria-label="Get Saviour on Google Play">
        <svg viewBox="0 0 300 89" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
          <rect x="1" y="1" width="298" height="87" rx="14" fill="#000" stroke="#3a3a3a" stroke-width="1.5"/>
          <g transform="translate(24,24)">
            <polygon points="0,0 34,17 5,20" fill="#00C3FF"/>
            <polygon points="34,17 34,23 5,20" fill="#FFCE00"/>
            <polygon points="34,23 0,40 5,20" fill="#FF473E"/>
            <polygon points="0,40 0,0 5,20" fill="#00D66B"/>
          </g>
          <text x="82" y="34" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.5">GET IT ON</text>
          <text x="81" y="63" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500">Google Play</text>
        </svg>
      </a>

      <!-- Official-style "Download on the App Store" badge, shown dimmed until
           the iOS app is live. The script below upgrades this <span> to a real
           App Store link (reusing this same artwork) once IOS_URL is set. -->
      <span class="badge soon" id="iosBtn" aria-label="Coming soon on the App Store">
        <svg viewBox="0 0 300 89" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
          <rect x="1" y="1" width="298" height="87" rx="14" fill="#000" stroke="#3a3a3a" stroke-width="1.5"/>
          <g transform="translate(28,18) scale(2.1)" fill="#fff">
            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
          </g>
          <text x="84" y="37" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="12">Download on the</text>
          <text x="83" y="65" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500">App Store</text>
        </svg>
      </span>
      <p class="coming" id="iosSoon">Coming soon to iOS</p>
    </div>

    <p class="redirecting" id="redirecting" hidden>Opening your app store…</p>
    <p class="note">Choose your store above to download Saviour.</p>
  </main>

  <script>
    (function () {
      // --- Store links (single source of truth) -------------------------
      var ANDROID_URL =
        'https://play.google.com/store/apps/details?id=com.swarjun.saviour';
      var IOS_URL = ''; // TODO: set to the App Store URL once Saviour is live on iOS.

      // --- Device sniff --------------------------------------------------
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isAndroid = /android/i.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

      // Upgrade the iOS badge to a real App Store link once we have one,
      // reusing the badge artwork that's already in the page.
      if (IOS_URL) {
        var iosBtn = document.getElementById('iosBtn');
        var iosLink = document.createElement('a');
        iosLink.className = 'badge';
        iosLink.href = IOS_URL;
        iosLink.setAttribute('aria-label', 'Download Saviour on the App Store');
        iosLink.innerHTML = iosBtn.innerHTML;
        iosBtn.parentNode.replaceChild(iosLink, iosBtn);
        var soon = document.getElementById('iosSoon');
        if (soon) soon.hidden = true;
      }

      // Redirect mobile visitors straight to their store.
      var target = isAndroid ? ANDROID_URL : (isIOS && IOS_URL ? IOS_URL : '');
      if (target) {
        document.getElementById('redirecting').hidden = false;
        window.location.replace(target);
      }
    })();
  </script>
</body>
</html>
